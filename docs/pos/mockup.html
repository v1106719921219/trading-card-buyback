<title>山口店 POS モック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: iPad landscape app. Left rail = sections, main pane = current step, right pane = running totals. Stacks on phones. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel-2:#e9e5dc; --line:#d6d0c4; --fg:#1f2a2e; --muted:#5f6b70;
  --accent:#1f6f5f; --accent-fg:#ffffff; --accent-soft:#dcebe5;
  --warn:#9a5b00; --warn-soft:#f6e7c8; --bad:#a0332b; --bad-soft:#f5dcd8; --good:#2e6b3a; --good-soft:#d9ebd9;
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171a1c; --panel:#20252a; --panel-2:#2a3036; --line:#3a424a; --fg:#e8e6e0; --muted:#9aa5ab;
  --accent:#4fb39b; --accent-fg:#0d1a16; --accent-soft:#223a34;
  --warn:#e2a64a; --warn-soft:#3d2f16; --bad:#e07a70; --bad-soft:#4a2320; --good:#7cc48a; --good-soft:#1f3a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a1c; --panel:#20252a; --panel-2:#2a3036; --line:#3a424a; --fg:#e8e6e0; --muted:#9aa5ab;
  --accent:#4fb39b; --accent-fg:#0d1a16; --accent-soft:#223a34;
  --warn:#e2a64a; --warn-soft:#3d2f16; --bad:#e07a70; --bad-soft:#4a2320; --good:#7cc48a; --good-soft:#1f3a26; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:76px 1fr;min-height:100%;}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding-block:10px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:6px;gap:4px;position:sticky;top:0;height:100vh}
.rail .brand{font-weight:700;font-size:12px;text-align:center;color:var(--muted);letter-spacing:.08em;padding:6px 0 10px}
.rail button{border:0;background:transparent;border-radius:10px;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--muted)}
.rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rail .spacer{flex:1}
.rail .staff{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:700}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.steps span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-fg);font-weight:700}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.content{display:grid;grid-template-columns:1fr 340px;gap:16px;padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));flex:1;min-width:0}
.content.single{grid-template-columns:1fr}
.pane{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card+.card{margin-top:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:140px}
input[type=text],input[type=date],input[type=number],select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:500;min-height:44px}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.big{font-size:17px;padding:14px 22px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--panel);cursor:pointer;font-size:14px;min-height:38px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.total{font-family:var(--mono);font-size:30px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);font-weight:700}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:6px;font-size:13px}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.good{border-color:var(--good);background:var(--good-soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block}
.item .nm small{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:2px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions .btn{min-height:76px;font-size:17px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.actions .btn small{font-weight:400;font-size:12px;color:var(--muted)}
.actions .btn.p small{color:var(--accent-fg);opacity:.85}
canvas.sig{width:100%;height:170px;border:1px dashed var(--line);border-radius:10px;background:var(--panel);touch-action:none;display:block}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:13px;line-height:1.7;max-height:380px;overflow:auto}
.doc h3{font-size:16px;margin:0 0 8px;text-align:center}
.doc h4{font-size:13px;margin:12px 0 4px}
.doc ol{padding-left:18px;margin:0}
.receipt{font-family:var(--mono);font-size:12.5px;background:#fff;color:#111;border:1px solid var(--line);padding:18px 16px;width:300px;max-width:100%;margin:0 auto;line-height:1.55;white-space:pre-wrap}
.photo{border:2px dashed var(--line);border-radius:10px;min-height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);text-align:center;padding:10px;background:var(--panel-2)}
.footer-nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:14px}
.cand{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.cand .score{font-size:12px;color:var(--muted);font-family:var(--mono)}
.kbd{font-family:var(--mono);background:var(--panel-2);padding:1px 6px;border-radius:4px;font-size:12px}
.srch{position:relative}
.srch .res{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.srch .res .item{cursor:pointer}
.srch .res .item:hover{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.start{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px}
.start .big2{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:min(760px,100%)}
.start .big2 button{border:2px solid var(--line);background:var(--panel);border-radius:20px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:28px;font-weight:700;cursor:pointer}
.start .big2 button svg{width:72px;height:72px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.start .big2 button.buy{color:var(--warn);border-color:var(--warn)}
.start .big2 button.sell{color:var(--accent);border-color:var(--accent)}
.start .big2 button small{font-size:14px;font-weight:400;color:var(--muted)}
@media (max-width:600px){.start .big2{grid-template-columns:1fr}.start .big2 button{min-height:160px}}
.mockbar{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:4px 16px;text-align:center;border-bottom:1px solid var(--line)}
@media (max-width:900px){
  .content{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail .brand,.rail .spacer,.rail .staff{display:none}
  .rail button{flex-direction:row;padding:8px 12px;white-space:nowrap}
  .topbar{top:0}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="mockbar">モックアップです。データは例で、保存や印刷は行いません。iPad 横向きを想定しています。</div>
<div class="app">
  <nav class="rail" id="rail">
    <div class="brand">POS</div>
    <button data-sec="start"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>待機</button>
    <button data-sec="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>状況</button>
    <button data-sec="buy"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>買取</button>
    <button data-sec="sell"><svg viewBox="0 0 24 24"><path d="M3 5h2l2 11h11l2-7H7"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>販売</button>
    <button data-sec="stock"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>在庫</button>
    <button data-sec="prices"><svg viewBox="0 0 24 24"><path d="M20 13l-7 7-10-10V4h6z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>価格表</button>
    <button data-sec="reg"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8V5h10v3M7 13h4"/></svg>レジ</button>
    <button data-sec="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>履歴</button>
    <button data-sec="analytics"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>分析</button>
    <button data-sec="ledger"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>台帳</button>
    <button data-sec="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
    <div class="spacer"></div>
    <div class="staff">山口店<br>担当: 中村</div>
  </nav>
  <div class="main">
    <div class="topbar">
      <h1 id="title">ホーム</h1>
      <div class="steps" id="steps" hidden></div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- sample data ----------
const PRODUCTS=[
 {id:1,name:'リザードン ex (SAR)',code:'SV4a 349/190',price:16000,market:19800},
 {id:2,name:'ナンジャモ (SAR)',code:'SV2D 096/071',price:21000,market:26500},
 {id:3,name:'ピカチュウ ex (SAR)',code:'SV8a 243/187',price:9500,market:12000},
 {id:4,name:'ミモザ (SAR)',code:'SV1V 089/078',price:7200,market:9000},
 {id:5,name:'ルギア V (SA)',code:'S12 110/098',price:5600,market:7100},
 {id:6,name:'カイ (SAR)',code:'S12a 227/172',price:12500,market:15800},
];
const RANKS=[{code:'A',label:'美品',rate:1},{code:'B',label:'白かけ・軽い傷',rate:.8},{code:'C',label:'傷・凹み',rate:.5},{code:'D',label:'要相談',rate:null}];
const BANDS=[{label:'50円',price:50},{label:'100円',price:100},{label:'300円',price:300},{label:'500円',price:500}];
const CUSTOMERS=[
 {id:'c1',name:'山本 拓也',phone:'090-1234-5678',visits:3,last:'2026-09-12',idType:'運転免許証',address:'山口県山口市中央1-2-3',birth:'1994-05-20',job:'会社員'},
 {id:'c2',name:'佐藤 美咲',phone:'080-9876-5432',visits:1,last:'2026-10-02',idType:'マイナンバーカード',address:'山口県防府市栄町4-5',birth:'2009-01-15',job:'高校生'},
];
const state={sec:'start',step:0,customer:null,items:[],rank:'A',band:null,idc:{type:'運転免許証',photo:false,hand:false,guardian:false,name:'',address:'',birth:'',job:''},signed:false,approved:false,cart:[],inStock:[
 {name:'ルギア V (SA)',code:'S12 110/098',rank:'A',cost:5600,sale:7800,bc:'YS-000118',alloc:'store'},
 {name:'ミモザ (SAR)',code:'SV1V 089/078',rank:'B',cost:5760,sale:8200,bc:'YS-000119',alloc:'store'},
 {name:'カイ (SAR)',code:'S12a 227/172',rank:'A',cost:12500,sale:15800,bc:'YS-000120',alloc:'store'},
 {name:'リザードン ex (SAR)',code:'SV4a 349/190',rank:'A',cost:16000,sale:null,bc:'YS-000121',alloc:'pending'},
 {name:'ピカチュウ ex (SAR)',code:'SV8a 243/187',rank:'B',cost:7600,sale:null,bc:'YS-000122',alloc:'pending'},
],settings:{rate:95,autoSync:true,syncTime:'04:00',priceDisplay:'ipad',threshold:100000}};
const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');
const BUY_STEPS=['受付','査定','提示','本人確認','署名','支払い','完了'];
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function age(b){if(!b)return null;const d=new Date(b),n=new Date('2026-10-31');let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a}
function total(){return state.items.reduce((s,i)=>s+i.qty*i.unit,0)}

// ---------- rendering ----------
function go(sec){state.sec=sec;if(sec==='buy'&&state.step===0)state.step=0;render()}
function render(){
  document.querySelectorAll('#rail button').forEach(b=>b.classList.toggle('on',b.dataset.sec===state.sec));
  const v=document.getElementById('view'),t=document.getElementById('title'),s=document.getElementById('steps');
  s.hidden=state.sec!=='buy';
  if(state.sec==='buy'){s.innerHTML=BUY_STEPS.map((n,i)=>`<span class="${i===state.step?'on':i<state.step?'done':''}">${i+1} ${n}</span>`).join('')}
  const map={start:start,home:home,buy:buy,sell:sell,stock:stock,reg:reg,ledger:ledger,history:history,analytics:analytics,settings:settings,prices:prices};
  t.textContent={start:'山口店 POS',home:'本日の状況',buy:'買取',sell:'販売',stock:'在庫',reg:'レジ',ledger:'古物台帳',history:'取引履歴',analytics:'売上分析',settings:'設定',prices:'価格表'}[state.sec];
  v.innerHTML=map[state.sec]();
  wire();
}
function summaryPane(){
  const rows=state.items.map((i,k)=>`<tr><td>${i.name}<br><small class="muted">${i.code||''} ${i.rank?'<span class="tag">'+i.rank+'</span>':''}</small></td><td class="r num">${i.qty}</td><td class="r num">${yen(i.unit)}</td><td class="r num">${yen(i.qty*i.unit)}</td><td><button class="btn ghost" data-del="${k}" aria-label="削除">×</button></td></tr>`).join('');
  return `<div class="pane"><div class="card"><h2>査定明細</h2>
  ${state.customer?`<div class="muted">${state.customer.name} 様 ・ 来店 ${state.customer.visits} 回目</div>`:'<div class="muted">顧客未選択</div>'}
  <table style="margin-top:8px"><thead><tr><th>商品</th><th class="r">数</th><th class="r">単価</th><th class="r">金額</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">まだ明細がありません</td></tr>'}</tbody></table>
  <div class="row" style="justify-content:space-between;margin-top:12px"><span class="muted">合計 ${state.items.reduce((s,i)=>s+i.qty,0)} 点</span><span class="total">${yen(total())}</span></div>
  </div></div>`;
}

function start(){
  return `<div class="start">
   <div class="big2">
    <button class="buy" data-go="buy"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>買取<small>受付 → 査定 → 本人確認 → 現金払い</small></button>
    <button class="sell" data-go="sell"><svg viewBox="0 0 24 24"><path d="M3 5h2l2 11h11l2-7H7"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>販売<small>スキャン / 価格帯で会計</small></button>
   </div>
   <div class="row" style="gap:14px"><span class="muted">進行中の受付 2 件</span><button class="btn" data-go="home">本日の状況</button><button class="btn ghost" data-go="stock">在庫</button><button class="btn ghost" data-go="reg">レジ</button></div>
   <div class="muted">取引が終わると自動でこの画面に戻ります。金額など内部の数字はこの画面には出しません。</div>
  </div>`;
}
function home(){
  return `<div class="content single"><div class="pane">
  <div class="tiles">
   <div class="tile"><div class="k">本日の買取</div><div class="v">¥48,300</div><div class="muted">7 件</div></div>
   <div class="tile"><div class="k">本日の販売</div><div class="v">¥31,900</div><div class="muted">12 件 ・ 粗利 ¥9,400</div></div>

      $('photo').onclick=()=>{$('extra').innerHTML=`<div class="card"><h2>写真から読み取り</h2><div class="row" style="align-items:stretch"><div class="photo" style="flex:1"><b>カードを枠に合わせて撮影</b><span>型番（左下の番号）を読み取ります</span></div><div class="col" style="flex:1"><div class="muted">候補（例）。店員が確定します。</div><div class="cand" data-add="1"><div class="nm" style="flex:1"><b>リザードン ex (SAR)</b><br><small class="muted">SV4a 349/190</small></div><span class="score">一致 97%</span><button class="btn">これ</button></div><div class="cand" data-add="3"><div class="nm" style="flex:1"><b>ピカチュウ ex (SAR)</b><br><small class="muted">SV8a 243/187</small></div><span class="score">一致 41%</span><button class="btn">これ</button></div></div></div></div>`;
        $('extra').querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>addProduct(PRODUCTS.find(p=>p.id==el.dataset.add)))};
      $('bulk').onclick=()=>{$('extra').innerHTML=`<div class="card"><h2>まとめ買取（1 枚ずつ登録しません）</h2><div class="row">${BANDS.map(b=>`<button class="chip ${state.band===b.price?'on':''}" data-band="${b.price}">${b.label}</button>`).join('')}<label class="f" style="max-width:140px">枚数<input type="number" id="bq" value="120"></label><button class="btn p" id="addb">明細に追加</button></div><div class="muted" style="margin-top:8px">枚数は手で数えるのが基本。はかりで概算する場合は 1 枚およそ 1.7 g。</div></div>`;

    document.querySelectorAll('[data-buy]').forEach(el=>el.onchange=()=>{const id=+el.dataset.buy;state.priceAdj[id]={...(state.priceAdj[id]||{}),buy:+el.value,locked:true};toast('店舗の買取価格を調整済みにしました（同期で上書きされません）');render()});
    document.querySelectorAll('[data-sale]').forEach(el=>el.onchange=()=>{const id=+el.dataset.sale;state.priceAdj[id]={...(state.priceAdj[id]||{}),sale:+el.value};toast('標準売価を保存しました（例）')});
    document.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>{const id=+b.dataset.unlock;state.priceAdj[id]={...(state.priceAdj[id]||{}),buy:undefined,locked:false};toast('次の同期から通販の価格に戻ります');render()});
    $('addprod').onclick=()=>toast('店舗専用の商品を追加します（名前・型番・買取価格・売価）（例）');
  }
  if(state.sec==='settings'){
    const s=state.settings;
    $('s-auto').onclick=()=>{s.autoSync=!s.autoSync;render()};
    $('s-time').onchange=()=>{s.syncTime=$('s-time').value};
    $('s-rate').onchange=()=>{s.rate=+$('s-rate').value||s.rate;render()};
    $('s-th').onchange=()=>{s.threshold=+$('s-th').value||s.threshold};
    document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{s.priceDisplay=b.dataset.pd;render()});
    $('syncnow').onclick=()=>toast('通販の価格表を同期しました: 33,551 件、調整済み 12 件は据え置き（例）');
    $('testprint').onclick=()=>toast('テスト印刷を送りました（例）');
    $('ssave').onclick=()=>toast('設定を保存しました（例）');
  }
  if(state.sec==='history'){
    document.querySelectorAll('[data-htab]').forEach(b=>b.onclick=()=>{state.histTab=b.dataset.htab;render()});
    document.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>toast(`${b.dataset.rp} を再印刷しました（例）`));
    document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>toast('申込書 PDF を開きます（例）'));
    document.querySelectorAll('[data-rcpt]').forEach(b=>b.onclick=()=>toast('宛名を入力して領収書を印刷します（例）'));
    document.querySelectorAll('[data-ret]').forEach(b=>b.onclick=()=>toast('返金を記録し、在庫に戻しました（例）'));
    document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>toast('保存した査定を呼び出します（例）'));
  }
  if(state.sec==='reg'){$('counted').oninput=()=>{const v=+$('counted').value;$('diff').textContent=$('counted').value===''?'—':(v-83600>=0?'+':'−')+yen(Math.abs(v-83600))};$('close').onclick=()=>toast('レジを締めました（例）')}
}
function addProduct(p){const r=RANKS.find(x=>x.code===state.rank);const unit=r.rate!=null?Math.round(p.price*r.rate/100)*100:p.price;const ex=state.items.find(i=>i.id===p.id&&i.rank===state.rank);if(ex)ex.qty++;else state.items.push({id:p.id,name:p.name,code:p.code,qty:1,unit,rank:state.rank});toast(`${p.name} を追加（${state.rank}）`);render()}
function pad(c,onDraw){const dpr=window.devicePixelRatio||1;const w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim()||'#000';let d=false;const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};c.onpointermove=e=>{if(!d)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();onDraw()};c.onpointerup=c.onpointercancel=()=>{d=false}}
document.querySelectorAll('#rail button').forEach(b=>b.onclick=()=>go(b.dataset.sec));
render();
</script>
